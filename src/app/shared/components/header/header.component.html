<header>
  <nav class="navbar navbar-expand-lg navbar-light p-3">
    <div class="container-lg d-flex justify-content-between">
      <a
        class="navbar-brand fw-bold"
        [routerLink]="['/']"
        routerLinkActive="router-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Conduit</a
      >
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div #navbarCollaspe class="collapse navbar-collapse" id="navbarNav">
        <div class="ms-auto">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                (click)="closeNavbar()"
                [routerLink]="['/']"
                routerLinkActive="router-link-active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link active d-flex justify-content-center align-items-center gap-2"
                aria-current="page"
              >
                <i class="fa-regular fa-pen-to-square"></i>
                Home
              </a>
            </li>
            <li class="nav-item">
              <a
                (click)="closeNavbar()"
                [routerLink]="['/auth/sign-in']"
                routerLinkActive="router-link-active"
                class="nav-link d-flex justify-content-center align-items-center gap-2"
                href="#"
              >
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
              </a>
            </li>
            <li class="nav-item">
              <a
                (click)="closeNavbar()"
                [routerLink]="['/auth/sign-up']"
                routerLinkActive="router-link-active"
                class="nav-link d-flex justify-content-center align-items-center"
                tabindex="-1"
                aria-disabled="true"
                >Sign Up</a
              >
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
